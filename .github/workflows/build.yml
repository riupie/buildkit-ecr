name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild to pick up upstream security patches
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      buildkit_version:
        description: "BuildKit version to build against (e.g. v0.21.0)"
        required: false
        default: ""

env:
  IMAGE_NAME: riupie/buildkit-ecr
  BUILDKIT_VERSION: v0.29.0
  ECR_HELPER_VERSION: v0.12.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        variant:
          - target: standard
            tag_suffix: ""
          - target: rootless
            tag_suffix: "-rootless"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve BuildKit version
        id: versions
        run: |
          BK_VERSION="${{ github.event.inputs.buildkit_version }}"
          if [ -z "$BK_VERSION" ]; then
            BK_VERSION="${{ env.BUILDKIT_VERSION }}"
          fi
          echo "buildkit_version=${BK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ecr_helper_version=${{ env.ECR_HELPER_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Append -rootless suffix to every tag for the rootless variant
          flavor: |
            suffix=${{ matrix.variant.tag_suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.buildkit_version }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=buildkit-ecr
            org.opencontainers.image.description=BuildKit with amazon-ecr-credential-helper for AWS IRSA support
            org.opencontainers.image.vendor=riupie
            io.buildkit.version=${{ steps.versions.outputs.buildkit_version }}
            io.ecr-helper.version=${{ steps.versions.outputs.ecr_helper_version }}
            io.buildkit.variant=${{ matrix.variant.target }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push (${{ matrix.variant.target }})
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_VERSION=${{ steps.versions.outputs.buildkit_version }}
            ECR_HELPER_VERSION=${{ steps.versions.outputs.ecr_helper_version }}
          cache-from: type=gha,scope=${{ matrix.variant.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.target }}
          provenance: true
          sbom: true

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed ${{ env.IMAGE_NAME }} (${{ matrix.variant.target }}) digest ${{ steps.build-push.outputs.digest }}"
